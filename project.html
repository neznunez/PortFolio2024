<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Projeto</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f4f4f9;
            position: relative;
        }
        .project-container {
            max-width: 800px;
            padding: 20px;
            background: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            text-align: center;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 10px 0;
        }
        h1, p {
            margin: 10px 0;
        }
        .fade-in {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        }
        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .back-button {
            position: absolute;
            top: 40px;
            left: 40px;
            color: black;
            text-decoration: none;
            font-size: 28px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            transition: color 0.3s ease;
        }
        .back-button:hover {
            color: red;
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-button" id="back-button">BACK</a>
    <div class="project-container">
        <h1 id="project-title" class="fade-in"></h1>
        <p id="project-description" class="fade-in"></p>
        <div id="project-images" class="fade-in"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const projectId = urlParams.get('id');

            if (!projectId) {
                window.location.href = 'index.html'; // Redireciona para index.html se não houver id
                return;
            }

            fetch('projects.json')
                .then(response => response.json())
                .then(data => {
                    const project = data.find(p => p.id == projectId);
                    if (project) {
                        document.getElementById('project-title').textContent = project.title;
                        document.getElementById('project-description').textContent = project.description;
                        const imagesContainer = document.getElementById('project-images');
                        project.images.forEach(image => {
                            const imgElement = document.createElement('img');
                            imgElement.src = image;
                            imagesContainer.appendChild(imgElement);
                        });
                        document.querySelectorAll('.fade-in').forEach(el => {
                            el.classList.add('visible');
                        });
                    }
                })
                .catch(error => console.error('Erro ao carregar os dados do projeto:', error));
        });

        document.getElementById('back-button').addEventListener('click', function(event) {
            event.preventDefault();
            gsap.to(document.body, {
                opacity: 0,
                duration: 1,
                ease: "power1.inOut",
                onComplete: function() {
                    window.location.href = 'index.html';
                }
            });
        });
    </script>
</body>
</html>
