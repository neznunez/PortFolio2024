<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Projeto</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f9;
            position: relative;
        }
        .project-container {
            position: absolute;
            width: 80%;
            height: 60%;
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 1;
            backdrop-filter: blur(5px);
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 10px 0;
        }
        h1, p {
            margin: 10px 0;
            color: white;
        }
        .fade-in {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        }
        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .back-button {
            position: absolute;
            top: 40px;
            left: 40px;
            color: white;
            text-decoration: none;
            font-size: 28px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            transition: color 0.3s ease;
            z-index: 2;
            text-transform: none;
        }
        .back-button:hover {
            color: red;
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-button" id="back-button">Back</a>
    <div class="project-container">
        <h1 id="project-title" class="fade-in"></h1>
        <p id="project-description" class="fade-in"></p>
        <div id="project-images" class="fade-in"></div>
    </div>

    <script src="libs/gsap.min.js"></script>
    <script type="module">
        import * as THREE from './libs/three.module.js';

        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const projectId = urlParams.get('id');

            if (!projectId) {
                window.location.href = 'index.html'; // Redireciona para index.html se não houver id
                return;
            }

            fetch('projects.json')
                .then(response => response.json())
                .then(data => {
                    const project = data.find(p => p.id == projectId);
                    if (project) {
                        document.getElementById('project-title').textContent = project.title;
                        document.getElementById('project-description').textContent = project.description;
                        const imagesContainer = document.getElementById('project-images');
                        project.images.forEach(image => {
                            const imgElement = document.createElement('img');
                            imgElement.src = image;
                            imagesContainer.appendChild(imgElement);
                        });
                        document.querySelectorAll('.fade-in').forEach(el => {
                            el.classList.add('visible');
                        });
                    }
                })
                .catch(error => console.error('Erro ao carregar os dados do projeto:', error));

            // Skybox setup
            let scene, camera, renderer;
            let angle = 0;

            function initSkybox() {
                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.set(0, 0, 5);

                renderer = new THREE.WebGLRenderer();
                renderer.setSize(window.innerWidth, window.innerHeight);
                document.body.appendChild(renderer.domElement);

                const loader = new THREE.CubeTextureLoader();
                const skyboxes = [
                    [
                        'desertdawn/desertdawn_ft.jpg', 'desertdawn/desertdawn_bk.jpg',
                        'desertdawn/desertdawn_up.jpg', 'desertdawn/desertdawn_dn.jpg',
                        'desertdawn/desertdawn_rt.jpg', 'desertdawn/desertdawn_lf.jpg'
                    ],
                    [
                        'Park2/posx.jpg', 'Park2/negx.jpg',
                        'Park2/posy.jpg', 'Park2/negy.jpg',
                        'Park2/posz.jpg', 'Park2/negz.jpg'
                    ],
                    [
                        'Rainbow/rainbow_ft.png', 'Rainbow/rainbow_bk.png',
                        'Rainbow/rainbow_up.png', 'Rainbow/rainbow_dn.png',
                        'Rainbow/rainbow_rt.png', 'Rainbow/rainbow_lf.png'
                    ],
                    [
                        'Lycksele3/posx.jpg', 'Lycksele3/negx.jpg',
                        'Lycksele3/posy.jpg', 'Lycksele3/negy.jpg',
                        'Lycksele3/posz.jpg', 'Lycksele3/negz.jpg'
                    ]
                ];
                const selectedSkybox = skyboxes[Math.floor(Math.random() * skyboxes.length)];
                const texture = loader.load(selectedSkybox);

                scene.background = texture;
                animate();
            }

            function animate() {
                requestAnimationFrame(animate);
                angle += 0.001; // Ajuste a velocidade conforme necessário
                camera.position.x = 5 * Math.sin(angle);
                camera.position.z = 5 * Math.cos(angle);
                camera.lookAt(scene.position);
                renderer.render(scene, camera);
            }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            initSkybox();
        });

        document.getElementById('back-button').addEventListener('click', function(event) {
            event.preventDefault();
            gsap.to(document.body, {
                opacity: 0,
                duration: 1,
                ease: "power1.inOut",
                onComplete: function() {
                    window.location.href = 'index.html';
                }
            });
        });
    </script>
</body>
</html>
