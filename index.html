    <style>
        body, html {
            margin: 0;
            overflow: hidden;
            height: 100%;
            font-family: Arial, sans-serif;
        }
        
        #loading-screen, .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #33ff33;
            font-family: 'Courier New', monospace;
        }
        
        #loading-screen {
            z-index: 9999;
        }
        
        .loading-screen {
            z-index: 2000;
            transition: opacity 1.5s ease-out;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .tooltip {
            position: absolute;
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            pointer-events: none;
            visibility: hidden;
        }
        .card {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 240px;
            height: 140px;
            background-color: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.3s ease, width 0.3s ease, height 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }
        .loading-text {
            color: #33ff33;
            font-size: 24px;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
            text-shadow: 0 0 5px #33ff33;
        }
        .loading-bar-container {
            width: 300px;
            height: 20px;
            background-color: #111;
            border: 2px solid #33ff33;
            box-shadow: 0 0 10px #33ff33;
            overflow: hidden;
            position: relative;
        }
        .loading-bar {
            height: 100%;
            width: 0%;
            background-color: #33ff33;
            position: relative;
            box-shadow: 0 0 15px #33ff33;
        }
        .loading-bar::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                45deg,
                #33ff33,
                #33ff33 10px,
                #2dd32d 10px,
                #2dd32d 20px
            );
            opacity: 0.3;
        }
        .loading-percentage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #11ff00;
            font-weight: bold;
            mix-blend-mode: difference;
        }
        /* Estilo para o botão de skybox */
        .skybox-button {
            position: fixed;
            bottom: 20px;
            left: 20px;
            padding: 10px 15px;
            background-color: rgba(0, 0, 0, 0.7);
            color: #33ff33;
            border: 2px solid #33ff33;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(51, 255, 51, 0.5);
            text-shadow: 0 0 5px #33ff33;
            letter-spacing: 2px;
            display: none; /* Inicialmente oculto */
        }
        
        .skybox-button:hover {
            background-color: rgba(51, 255, 51, 0.2);
            transform: scale(1.05);
        }
        
        .skybox-button:active {
            transform: scale(0.95);
        }

        /* Estilo para a notificação inicial */
        .initial-notification,
        .navigation-notification,
        .return-notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.8);
            color: #33ff33;
            border: 2px solid #33ff33;
            padding: 15px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            text-align: right;
            z-index: 9999;
            box-shadow: 0 0 15px rgba(51, 255, 51, 0.7);
            max-width: 250px;
            pointer-events: none;
            text-shadow: 0 0 5px #33ff33;
            letter-spacing: 1px;
        }

        .notification-pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 15px rgba(51, 255, 51, 0.7);
            }
            50% {
                box-shadow: 0 0 25px rgba(51, 255, 51, 0.9);
            }
            100% {
                box-shadow: 0 0 15px rgba(51, 255, 51, 0.7);
            }
        }

        /* Efeito de pulso para as notificações */
        .notification-pulse {
            animation: notification-pulse 2s infinite;
        }

        @keyframes notification-pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(51, 255, 51, 0.7);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(51, 255, 51, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(51, 255, 51, 0);
            }
        }
    </style>

        // Função para criar e adicionar um cubo à cena
        function createAndAddCube(projectId, projectData) {
             console.log("Adicionando cubo para o projeto:", projectId);
             
             // Verificar se o projectData tem um título válido
             const projectTitle = projectData.title || projectData.name || "Projeto " + projectId;
             console.log("Título do projeto:", projectTitle);
             
             // --- Logic adapted from the original loop in addCubesAroundSphere ---
             var position, isTooClose;
             // Define constants needed for positioning (or get from global scope if they still exist)
             var sphereRadius = 1;
             var minDistanceFromSphere = 3.65;
             var totalRadius = sphereRadius + minDistanceFromSphere;
             var minDistanceBetweenCubes = 2;

             // Find a valid position (ensure it's not too close to others)
             let attempts = 0;
             const MAX_ATTEMPTS = 100; // Prevent infinite loops
             do {
                 position = new THREE.Vector3(
                     (Math.random() - 0.5) * 2 * totalRadius,
                     (Math.random() - 0.5) * 2 * totalRadius,
                     (Math.random() - 0.5) * 2 * totalRadius
                 );
                 // Check distance from center and other cubes
                 isTooClose = cubeArray.some(existingCube => existingCube.position.distanceTo(position) < minDistanceBetweenCubes);
                 attempts++;
                 if (attempts > MAX_ATTEMPTS) {
                     console.warn("Could not find a suitable position for cube", projectId, "after", MAX_ATTEMPTS, "attempts. Placing further out.");
                     // Fallback: place it further out or handle differently
                     totalRadius += 0.5; // Slightly increase radius for next attempt cycle (or just place it)
                     position = position.normalize().multiplyScalar(totalRadius);
                     isTooClose = false; // Force placement
                 }
             } while ((isTooClose || position.length() < minDistanceFromSphere) && attempts <= MAX_ATTEMPTS); // Check min distance from sphere center too


             // Create geometry and material (reuse existing logic/style)
             var cubeGeometry = new THREE.BoxGeometry(1, 1, 1);
             var cubeMaterial = new THREE.MeshPhysicalMaterial({
                 color: 0xFFFFFF, // Default color
                 roughness: 0.5,
                 metalness: 0.1,
                 reflectivity: 0.9,
                 transparent: true,
                 opacity: 0.8,
                 transmission: 0.9,
                 side: THREE.DoubleSide
             });
             var cube = new THREE.Mesh(cubeGeometry, cubeMaterial);
             cube.position.copy(position);

             // Store Firestore data in userData
             cube.userData.projectId = projectId;
             // Keep 'project' object for compatibility with existing tooltip/click logic
             cube.userData.project = {
                id: projectId,
                name: projectTitle // Usar o título para o tooltip
             };
             
             // Log para depuração dos dados do projeto
             console.log("Dados de projeto configurados para o cubo:", {
                 projectId: projectId,
                 title: projectTitle,
                 userData: cube.userData
             });
             // Store original hex color for hover effect reset
             cube.currentHex = cubeMaterial.color.getHex();

             scene.add(cube);
             cubeArray.push(cube);
             cube.visible = false; // Initially hidden
        }

        // Função para remover um cubo da cena
        function removeCube(projectId) {
             console.log("Removing cube for project:", projectId);
             const index = cubeArray.findIndex(cube => cube.userData.projectId === projectId);
             if (index !== -1) {
                 const cubeToRemove = cubeArray[index];
                 // Animate removal?
                 gsap.to(cubeToRemove.scale, { x: 0, y: 0, z: 0, duration: 0.3, ease: "power1.in", onComplete: () => {
                     scene.remove(cubeToRemove);
                     // Optional: Dispose geometry/material
                     if (cubeToRemove.geometry) cubeToRemove.geometry.dispose();
                     if (cubeToRemove.material) {
                         if (Array.isArray(cubeToRemove.material)) {
                             cubeToRemove.material.forEach(m => m.dispose());
                         } else {
                             cubeToRemove.material.dispose();
                         }
                     }
                 }});
                 cubeArray.splice(index, 1);

                 // If this was the intersected cube, clear INTERSECTED
                 if (INTERSECTED === cubeToRemove) {
                     INTERSECTED = null;
                     tooltip.style.visibility = 'hidden';
                 }
                 // If this was the selected cube, reset focus state
                 if (selectedCube === cubeToRemove) {
                     resetCamera(); // Or handle focus reset appropriately
                     cubeFocused = false;
                     selectedCube = null;
                 }
             } else {
                 console.log("Cube to remove not found:", projectId);
             }
        }

         // Function to update cube data (e.g., for tooltips)
        function updateCubeData(projectId, projectData) {
             console.log("Atualizando dados do cubo para o projeto:", projectId);
             
             // Verificar se o projectData tem um título válido
             const projectTitle = projectData.title || projectData.name || "Projeto " + projectId;
             console.log("Novo título do projeto:", projectTitle);
             
             const cube = cubeArray.find(cube => cube.userData.projectId === projectId);
             if (cube) {
                 // Atualizar o userData usado pelo tooltip e outras interações
                 if (!cube.userData.project) {
                     cube.userData.project = {};
                 }
                 cube.userData.project.id = projectId;
                 cube.userData.project.name = projectTitle;
                 
                 // Se este cubo estiver atualmente com INTERSECTED, atualize o tooltip imediatamente
                 if (INTERSECTED === cube) {
                    tooltip.innerHTML = projectTitle;
                 }
                 
                 console.log("Dados do cubo atualizados:", cube.userData.project);
             } else {
                 console.warn("Cubo não encontrado para atualização:", projectId);
             }
        }


        // Function to listen for real-time project updates from Firestore
        function listenToProjects() {
            console.log("Configurando listener do Firestore para projetos...");
            
            try {
                // Verificar se existem projetos no Firestore
                db.collection("projetos").get().then((snapshot) => {
                    console.log(`Número de documentos na coleção projetos: ${snapshot.size}`);
                    
                    // Se não houver documentos, usar o fallback manual imediatamente

                        });

                    }
                }).catch((error) => {

                    console.error("Erro ao verificar a coleção projetos (db.collection.get):", error);
                    // Se a leitura inicial falhar (ex: regras impedem leitura), usar fallback
                    createCubesManually();
                });
            } catch (error) {
                // Erro mais geral na configuração
                console.error("Erro crítico ao configurar o Firestore (try/catch geral):", error);
                createCubesManually();
            }
        }

        // Nova função para configurar o listener do Firestore
        function setupFirestoreListener() {
            console.log("Limpando cubos existentes e configurando listener do Firestore...");
            
            // Primeiro remova todos os cubos existentes para evitar duplicatas ao (re)carregar
            while (cubeArray.length > 0) {
                const cube = cubeArray.pop();
                scene.remove(cube);
                // Liberar memória (opcional, mas recomendado)
                if (cube.geometry) cube.geometry.dispose();
                if (cube.material) {
                    if (Array.isArray(cube.material)) {
                        cube.material.forEach(m => m.dispose());
                    } else {
                        cube.material.dispose();
                    }
                }
            }
            console.log("Cubos limpos. Configurando listener do Firestore...");
            
            // Configurar o listener para atualizações em tempo real
            db.collection("projetos").onSnapshot((snapshot) => {
                console.log(`Snapshot do Firestore recebido: ${snapshot.docChanges().length} mudanças.`);
                
                // Processar as mudanças detectadas pelo Firestore
                snapshot.docChanges().forEach((change) => {
                    const projectId = change.doc.id;
                    const projectData = change.doc.data();
                    
                    console.log(`Tipo de mudança: ${change.type}, ID do Projeto: ${projectId}`);
                    
                    if (!projectData && change.type !== "removed") {
                        console.warn("Recebido change sem dados para o projeto:", projectId, change.type);
                        return; // Pular se não houver dados para added/modified
                    }
                    
                    // Verificar se projectData tem um título válido
                    if (projectData && !projectData.title && projectData.name) {
                        projectData.title = projectData.name;
                        console.log(`Usando campo 'name' como título para o projeto ${projectId}: ${projectData.title}`);
                    }

                    if (change.type === "added") {
                        // Verificar se o cubo já existe para evitar duplicatas (deveria ser raro com a limpeza acima)
                        if (!cubeArray.some(cube => cube.userData.projectId === projectId)) {
                            console.log(`Criando cubo para o projeto adicionado: ${projectId}, título: ${projectData.title || 'Sem título'}`);
                            createAndAddCube(projectId, projectData); // Esta função define visible = false
                        } else {
                            console.log("Cubo já existia para o projeto adicionado (inesperado após limpeza):", projectId, "- atualizando dados.");
                            updateCubeData(projectId, projectData);
                        }
                    }
                    if (change.type === "modified") {
                       console.log(`Atualizando cubo para o projeto modificado: ${projectId}, título: ${projectData.title || 'Sem título'}`);
                       updateCubeData(projectId, projectData); // Apenas atualiza dados, não visibilidade
                    }
                    if (change.type === "removed") {
                       console.log(`Removendo cubo para o projeto: ${projectId}`);
                       removeCube(projectId); // Remove o cubo da cena
                    }
                });

                // Log dos cubos atuais na cena após processar mudanças
                console.log(`Total de cubos na cena após snapshot: ${cubeArray.length}`);
                cubeArray.forEach((cube, index) => {
                    console.log(`- Cubo ${index}: ID=${cube.userData.projectId}, Título=${cube.userData.project?.name}, Visível=${cube.visible}`);
                });

            }, (error) => {
                console.error("Erro ao ouvir mudanças no Firestore:", error);
                // Se o listener falhar, tentar criar manualmente do JSON
                 createCubesManually(); // Esta função precisa ser revisada também
            });
        }

        // Função para criar cubos manualmente a partir do projects.json (Fallback)
        function createCubesManually() {
            console.log("Criando cubos manualmente a partir do projects.json (Fallback)...");
            
            // Limpar cubos existentes antes de criar do JSON
            while (cubeArray.length > 0) {
                const cube = cubeArray.pop();
                scene.remove(cube);
                if (cube.geometry) cube.geometry.dispose();
                if (cube.material) {
                    if (Array.isArray(cube.material)) {
                        cube.material.forEach(m => m.dispose());
                    } else {
                        cube.material.dispose();
                    }
                }
            }
            console.log("Cubos limpos antes da criação manual.");

            fetch('projects.json')
                .then(response => response.json())
                .then(projects => {
                    console.log("Dados carregados do projects.json para criação manual:", projects);
                    
                    projects.forEach(project => {
                        // Garantir que project contenha título antes de criar o cubo
                        if (!project.title && project.name) {
                            project.title = project.name; // Compatibilidade com formato antigo
                        } else if (!project.title) {
                            project.title = "Projeto " + project.id; // Título padrão se não houver
                        }
                        
                        console.log("Criando cubo manualmente para projeto:", project.id, project.title);
                        createAndAddCube(project.id, project); // Esta função define visible = false
                    });

                    // Log dos cubos criados manualmente
                    console.log(`Total de cubos na cena após criação manual: ${cubeArray.length}`);
                    cubeArray.forEach((cube, index) => {
                        console.log(`- Cubo Manual ${index}: ID=${cube.userData.projectId}, Título=${cube.userData.project?.name}, Visível=${cube.visible}`);
                    });
                })
                .catch(error => {
                    console.error("Erro ao carregar projects.json para criação manual:", error);
                    // Se até isso falhar, criar cubos padrão
                    createDefaultCubes(); // Esta função também precisa ser revisada
                });
        }

            defaultProjects.forEach(project => {

            // Log dos cubos padrão criados
            console.log(`Total de cubos na cena após criação padrão: ${cubeArray.length}`);
            cubeArray.forEach((cube, index) => {
                console.log(`- Cubo Padrão ${index}: ID=${cube.userData.projectId}, Título=${cube.userData.project?.name}, Visível=${cube.visible}`);
            });
        }

        // Função para carregar um skybox aleatório
        function loadRandomSkybox() {
            var randomIndex = Math.floor(Math.random() * skyboxes.length);
            var selectedSkybox = skyboxes[randomIndex];
            
            var loader = new THREE.CubeTextureLoader();
            loader.load(selectedSkybox, function(texture) {
                scene.background = texture;
                
                // Aplicar o mapa de ambiente aos materiais, exceto aos olhos
                scene.traverse(function(child) {
                    if (child.isMesh) {
                        // Verificar se o objeto é parte dos olhos
                        const isEyePart = child.name && (
                            child.name.toLowerCase().includes('eye') || 
                            child.name.toLowerCase().includes('olho')
                        );
                        
                        // Só aplicar o envMap se não for parte dos olhos
                        if (!isEyePart) {
                            if (child.material) {
                                if (Array.isArray(child.material)) {
                                    child.material.forEach(mat => {
                                        if (mat) {
                                            mat.envMap = texture;
                                            mat.envMapIntensity = 1.0;
                                        }
                                    });
                                } else if (child.material) {
                                    child.material.envMap = texture;
                                    child.material.envMapIntensity = 1.0;
                                }
                            }
                        }
                    }
                });
            }, undefined, function(error) {
                console.error('Erro ao carregar o skybox:', error);
            });
        }

            loadingPercentage.textContent = '0%';
            
            loadingBarContainer.appendChild(loadingBar);
            loadingBarContainer.appendChild(loadingPercentage);
            loadingScreen.appendChild(loadingText);
            loadingScreen.appendChild(loadingBarContainer);
            document.body.appendChild(loadingScreen);
            
            // Efeito de texto piscando
            var blinkInterval = setInterval(function() {
                loadingText.style.visibility = loadingText.style.visibility === 'hidden' ? 'visible' : 'hidden';
            }, 800);
            
            // Animar a barra de progresso
            var progress = 0;
            var loadingInterval = setInterval(function() {
                progress += Math.random() * 5;
                if (progress > 90) {
                    progress = 90; // Mantém em 90% até o carregamento real terminar
                    clearInterval(loadingInterval);
                }
                loadingBar.style.width = progress + '%';
                loadingPercentage.textContent = Math.round(progress) + '%';
            }, 300);
            
            var loader = new THREE.GLTFLoader();
            var modelPath = 'models/Nezpivot.glb'; // Modelo atual
            
            // Adicionar eventos de progresso ao carregador
            loader.load(
                modelPath, 
                function (gltf) {
                    // Modelo carregado com sucesso
                    model = gltf.scene;
                    model.position.set(0, -3, 0); // Ajustado o Y para -3 para descer o modelo
                    model.scale.set(1.2, 1.2, 1.2); // Escala normal desde o início
                    
                    // Adicionar o modelo à cena
                    scene.add(model);
                    
                    // Completar a barra de progresso
                    loadingBar.style.width = '100%';
                    loadingPercentage.textContent = '100%';
                    
                    // Parar o efeito de piscar
                    clearInterval(blinkInterval);
                    loadingText.style.visibility = 'visible';
                    
                    // Após um pequeno delay, fazer o fade-out da tela de carregamento
                    setTimeout(function() {
                        loadingScreen.style.opacity = '0';
                        setTimeout(function() {
                            document.body.removeChild(loadingScreen);
                        }, 1500);
                    }, 800);
                    
                    // Configurar animações
                    mixer = new THREE.AnimationMixer(model); // <-- USAR MIXER GLOBAL
                    gltf.animations.forEach((clip) => {
                        mixer.clipAction(clip).play();
                    });

                    // Iniciar com a câmera focada na cabeça
                    animateCameraToPosition(0, 0, 5);
                }, 
                // Callback de progresso
                function (xhr) {
                    if (xhr.lengthComputable) {
                        var percentComplete = xhr.loaded / xhr.total * 100;
                        // Atualizar a barra de progresso com o progresso real
                        loadingBar.style.width = Math.min(percentComplete, 100) + '%';
                        loadingPercentage.textContent = Math.round(percentComplete) + '%';
                    }
                }, 
                function (error) {
                    console.error(error);
                    loadingText.textContent = 'ERRO';
                    loadingText.style.color = '#ff3333';
                    loadingText.style.textShadow = '0 0 5px #ff3333';
                    loadingBar.style.backgroundColor = '#ff3333';
                    loadingBar.style.boxShadow = '0 0 15px #ff3333';
                    clearInterval(blinkInterval);
                    loadingText.style.visibility = 'visible';
                }
            );
        }

    // --- Função para Criar Novo Projeto no Firestore (NOVO) ---
    function createNewProject() {
        if (!isAdminLoggedIn) {
            showNotification("Apenas admins podem criar projetos.", "error", true);
            return;
        }
        if (!db) {
             showNotification("Erro: Conexão com banco de dados não disponível.", "error", true);
            return;
        }

        const createButton = document.getElementById('create-project-button');
        const originalButtonText = createButton ? createButton.textContent : 'Criar Novo Projeto'; // Guardar texto original
        if (createButton) {
             createButton.disabled = true; 
             createButton.textContent = 'Criando...'; // Mudar texto do botão
        }
        showNotification("Buscando IDs existentes...", "info", true);

        // 1. Buscar IDs existentes
        db.collection("projetos").get()
            .then((snapshot) => {
                console.log("Snapshot lido para encontrar max ID.");
                let maxId = 0;
                snapshot.forEach(doc => {
                    const numericId = parseInt(doc.id);
                    if (!isNaN(numericId) && numericId > maxId) {
                        maxId = numericId;
                    }
                });

                // 2. Determinar novo ID
                const newId = maxId + 1;
                const newIdString = newId.toString();
                console.log(`Próximo ID determinado: ${newIdString}`);

                // 3. Criar novo documento com dados padrão
                const newProjectData = {
                    title: "Novo Projeto " + newIdString,
                    description: "Descreva seu projeto aqui.\nUse \\n para novas linhas.",
                };
                
                showNotification(`Criando documento ${newIdString} no Firestore...`, "info", true);
                // Retornar a Promise do .set() E o newIdString para o próximo .then()
                return db.collection("projetos").doc(newIdString).set(newProjectData)
                         .then(() => newIdString); // Passa o ID adiante após o set ser bem-sucedido
            })
            .then((passedNewIdString) => { 
                console.log(`Novo projeto com ID ${passedNewIdString} criado no Firestore.`);
                showNotification(`Projeto ${passedNewIdString} criado com sucesso!`, "success", true);
            })
            .catch((error) => {
                console.error("Erro durante a criação do novo projeto:", error);
                showNotification(`Erro ao criar projeto: ${error.message}`, "error", true); 
            })
            .finally(() => {
                 // Restaurar botão
                 if (createButton) { 
                     createButton.disabled = false; 
                     createButton.textContent = originalButtonText; // Restaurar texto original
                 }
            });
    }
    // --- Fim Função Criar Novo Projeto ---

    // Chamar a adição dos botões (eles ficarão escondidos até o login)
    if (document.body) {
         addLogoutButtonIndex();
         addCreateProjectButton(); // Adicionar chamada para o novo botão
    } else {
         document.addEventListener('DOMContentLoaded', () => {
             addLogoutButtonIndex();
             addCreateProjectButton(); // Adicionar chamada para o novo botão
         });
    }

    // --- FIM: Novas Funções de Autenticação e Logout para index.html ---
}

var projectToPageMap = {
    "Projeto 1": "project.html?id=1",

var cubeFocused = false; // Uma nova variável para rastrear o estado do foco

function onDocumentMouseUp(event) {
    if (!mouseDown) return;
    event.preventDefault();
    raycaster.setFromCamera(mouse, camera);
    var intersects = raycaster.intersectObjects(cubeArray);
    
    if (intersects.length > 0) {
        if (!cubeFocused) {
            selectedCube = intersects[0].object;
            
            var cubeCenter = new THREE.Vector3();
            selectedCube.geometry.computeBoundingBox();
            selectedCube.geometry.boundingBox.getCenter(cubeCenter);
            cubeCenter.applyMatrix4(selectedCube.matrixWorld);

            gsap.to(camera.position, {
                x: cubeCenter.x,
                y: cubeCenter.y,
                z: cubeCenter.z + 2,
                duration: 2,
                ease: "power3.inOut"
            });

            controls.target.set(cubeCenter.x, cubeCenter.y, cubeCenter.z);
            cubeFocused = true;
        } else {
            var pageName = projectToPageMap[selectedCube.userData.project.name];
            
            if (pageName) {
                gsap.to(renderer.domElement, {
                    opacity: 0,
                    duration: 1,
                    ease: "power1.inOut",
                    onComplete: function() {
                        window.location.href = pageName;
                    }
                });
            } else {
                const projectId = selectedCube.userData.projectId;
                if (projectId) {
                    gsap.to(renderer.domElement, {
                        opacity: 0,
                        duration: 1,
                        ease: "power1.inOut",
                        onComplete: function() {
                            window.location.href = `project.html?id=${projectId}`;
                        }
                    });
                }
            }
        }
    } else if (cubeFocused) {
        resetCamera();
        cubeFocused = false;
        selectedCube = null;
    }
    mouseDown = false;
}

  function animate() {
    requestAnimationFrame(animate);
    
    const deltaTime = clock.getDelta(); // <-- ADICIONAR ESTA LINHA

    if (mixer) {
        mixer.update(deltaTime); // <-- MODIFICAR AQUI: usar deltaTime
    }

    renderer.render(scene, camera);
    
    // Lógica de rotação dos cubos
    cubeArray.forEach(cube => {
        var radius = Math.sqrt(cube.position.x * cube.position.x + cube.position.z * cube.position.z);
        // Calcula o incremento do ângulo para este frame usando deltaTime
        // rotationSpeed (ex: 0.005) agora é interpretado como radianos por segundo.
        let angleIncrement = rotationSpeed * deltaTime; 
        var currentAngle = Math.atan2(cube.position.z, cube.position.x) + angleIncrement;
        cube.position.x = Math.cos(currentAngle) * radius;
        cube.position.z = Math.sin(currentAngle) * radius;
    });
    
    if (selectedCube && cubeFocused) {
        var cubeCenter = new THREE.Vector3();
        selectedCube.geometry.computeBoundingBox();
        selectedCube.geometry.boundingBox.getCenter(cubeCenter);
        cubeCenter.applyMatrix4(selectedCube.matrixWorld);
        
        var distance = 1;
        var direction = new THREE.Vector3().subVectors(camera.position, cubeCenter).normalize().multiplyScalar(distance);
        var newPosition = cubeCenter.clone().add(direction);

        gsap.to(camera.position, {
            x: newPosition.x,
            y: newPosition.y,
            z: newPosition.z,
            duration: 2,
            onUpdate: function() {
                camera.lookAt(cubeCenter);
            }
        });
        
        controls.target.copy(cubeCenter);
    }
}

// Variáveis para controlar o estado dos botões e o contador de pressionamentos
var spacePressCount = 0;
var spacePressTimeout;

// Evento para detectar pressionamentos da barra de espaço
document.addEventListener('keydown', function(event) {
    if (event.code === 'Space') {
        event.preventDefault(); // Prevenir o scroll da página
        
        // Incrementar o contador de pressionamentos da barra de espaço
        spacePressCount++;
        
        // Limpar o timeout anterior se existir
        if (spacePressTimeout) {
            clearTimeout(spacePressTimeout);
        }
        
        // Definir um novo timeout para resetar o contador após 1 segundo
        spacePressTimeout = setTimeout(function() {
            spacePressCount = 0;
        }, 1000);
        
        // Verificar se a barra de espaço foi pressionada 3 vezes
        if (spacePressCount === 3) {
            // Mostrar ou ocultar o botão de skybox
            var skyboxButton = document.getElementById('skyboxButton');
            if (skyboxButton.style.display === 'none' || skyboxButton.style.display === '') {
                skyboxButton.style.display = 'block';
                // Animação de entrada
                gsap.fromTo(skyboxButton, 
                    { opacity: 0, scale: 0.8 }, 
                    { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.7)" }
                );
            } else {
                // Animação de saída
                gsap.to(skyboxButton, { 
                    opacity: 0, 
                    scale: 0.8, 
                    duration: 0.3, 
                    ease: "power2.in",
                    onComplete: function() {
                        skyboxButton.style.display = 'none';
                    }
                });
            }
            spacePressCount = 0; // Resetar o contador
        }
    }
});

  // Código para detectar a sequência de teclas "i" seguida de "d"
  let lastKeyPressed = '';
  let keySequence = '';
  
  document.addEventListener('keydown', function(event) {
    const key = event.key.toLowerCase();
    
    // Adiciona a tecla atual à sequência
    keySequence += key;
    
    // Verifica se a sequência termina com "id"
    if (keySequence.endsWith('id')) {
      // Alterna a visibilidade do card
      if (card.style.display === 'none') {
        card.style.display = 'flex';
        // Animação de entrada
        gsap.fromTo(card, 
          { opacity: 0, scale: 0.8 }, 
          { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.7)" }
        );
      } else {
        // Animação de saída
        gsap.to(card, { 
          opacity: 0, 
          scale: 0.8, 
          duration: 0.3, 
          ease: "power2.in",
          onComplete: function() {
            card.style.display = 'none';
          }
        });
      }
      
      // Limpa a sequência após detectar "id"
      keySequence = '';
    }
    
    // Limita o tamanho da sequência para evitar consumo de memória
    if (keySequence.length > 10) {
      keySequence = keySequence.slice(-10);
    }
  });
