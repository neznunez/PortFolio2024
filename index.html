        // Função para preparar array de 6 imagens (repetir se necessário)
        function prepareFaceImages(imageUrls) {
            // Validar input
            if (!imageUrls || !Array.isArray(imageUrls)) {
                return new Array(6).fill(null);
            }
            
            // Filtrar URLs válidas
            const validUrls = imageUrls.filter(url => url && typeof url === 'string');
            
            if (validUrls.length === 0) {
                return new Array(6).fill(null);
            }
            
            if (validUrls.length >= 6) {
                // Mais de 6: usar as 6 primeiras
                return validUrls.slice(0, 6);
            } else {
                // Menos de 6: repetir para completar
                const faces = [];
                for (let i = 0; i < 6; i++) {
                    faces.push(validUrls[i % validUrls.length]);
                }
                return faces;
            }
        }

        // Função para carregar texturas nas faces do cubo
        function loadCubeTextures(faceImages, materials) {
            return new Promise((resolve) => {
                let loadedCount = 0;
                let errorCount = 0;
                const totalFaces = 6;
                const validImages = faceImages.filter(img => img !== null).length;
                
                // Se não houver imagens válidas, resolver imediatamente
                if (validImages === 0) {
                    resolve();
                    return;
                }
                
                // Usar o textureLoader global (definido em init())
                if (!textureLoader) {
                    textureLoader = new THREE.TextureLoader();
                    textureLoader.setCrossOrigin('anonymous');
                }
                
                for (let i = 0; i < totalFaces; i++) {
                    if (faceImages[i] && materials[i]) {
                        // Tentar carregar textura
                        textureLoader.load(
                            faceImages[i],
                            (texture) => {
                                // Sucesso: configurar textura
                                try {
                                    texture.wrapS = THREE.ClampToEdgeWrapping;
                                    texture.wrapT = THREE.ClampToEdgeWrapping;
                                    texture.minFilter = THREE.LinearFilter;
                                    texture.magFilter = THREE.LinearFilter;
                                    
                                    materials[i].map = texture;
                                    materials[i].needsUpdate = true;
                                    
                                    loadedCount++;
                                } catch (error) {
                                    console.warn(`Erro ao configurar textura da face ${i}:`, error);
                                    errorCount++;
                                }
                                
                                // Resolver quando todas tentarem carregar
                                if (loadedCount + errorCount === validImages) {
                                    resolve();
                                }
                            },
                            undefined, // onProgress
                            (error) => {
                                // Erro ao carregar (CORS, 404, etc.)
                                console.warn(`Erro ao carregar textura da face ${i} (${faceImages[i]}):`, error);
                                errorCount++;
                                
                                // Manter material padrão (sem textura)
                                // Não fazer nada, material já está configurado
                                
                                // Resolver quando todas tentarem carregar
                                if (loadedCount + errorCount === validImages) {
                                    resolve();
                                }
                            }
                        );
                    } else {
                        // Sem imagem: contar como processado
                        loadedCount++;
                        if (loadedCount === totalFaces) {
                            resolve();
                        }
                    }
                }
            });
        }

                 isTooClose = cubeArray.some(existingCube => existingCube.position.distanceTo(position) < minDistanceBetweenCubes);
                 attempts++;
                 if (attempts > MAX_ATTEMPTS) {
                     console.warn("Could not find a suitable position for cube", projectId, "after", MAX_ATTEMPTS, "attempts. Placing further out.");
                     // Fallback: place it further out or handle differently
                     totalRadius += 0.5; // Slightly increase radius for next attempt cycle (or just place it)
                     position = position.normalize().multiplyScalar(totalRadius);
                     isTooClose = false; // Force placement
                 }
             } while ((isTooClose || position.length() < minDistanceFromSphere) && attempts <= MAX_ATTEMPTS); // Check min distance from sphere center too

             // Buscar imagens do Firestore
             let imageUrls = [];
             try {
                 if (db) {
                     const projectDoc = await db.collection("projetos").doc(projectId).get();
                     if (projectDoc.exists) {
                         imageUrls = projectDoc.data()?.images || [];
                     }
                 }
             } catch (error) {
                 console.warn(`Erro ao buscar imagens do projeto ${projectId}:`, error);
                 // Continuar com material padrão
             }
             
             // Preparar array de 6 imagens
             const faceImages = prepareFaceImages(imageUrls);
             
             // Verificar se há imagens válidas
             const hasImages = faceImages.some(img => img !== null);
             
             // Criar array de 6 materiais (um para cada face)
             // Se tiver imagens: mais opaco (0.95) e menos transparente (0.3)
             // Se não tiver imagens: material original (0.8) e mais transparente (0.9)
             const materials = [];
             for (let i = 0; i < 6; i++) {
                 const material = new THREE.MeshPhysicalMaterial({
                     color: 0xFFFFFF,
                     roughness: 0.5,
                     metalness: 0.1,
                     reflectivity: 0.9,
                     transparent: true,
                     opacity: hasImages ? 0.95 : 0.8,
                     transmission: hasImages ? 0.3 : 0.9,
                     side: THREE.DoubleSide
                 });
                 materials.push(material);
             }
             
             // Criar cubo com array de materiais
             var cubeGeometry = new THREE.BoxGeometry(1, 1, 1);
             var cube = new THREE.Mesh(cubeGeometry, materials);
             cube.position.copy(position);

             // Store Firestore data in userData
             cube.userData.projectId = projectId;
             // Keep 'project' object for compatibility with existing tooltip/click logic
             cube.userData.project = {
                id: projectId,
                name: projectTitle // Usar o título para o tooltip
             };
             // Armazenar se o cubo tem imagens (para animação usar opacidade correta)
             cube.userData.hasImages = hasImages;
             
             // Log para depuração dos dados do projeto
             console.log("Dados de projeto configurados para o cubo:", {
                 projectId: projectId,
                 title: projectTitle,
                 userData: cube.userData
             });
             // Store original hex color for hover effect reset
             // Para array de materiais, usar o primeiro
             cube.currentHex = materials[0].color.getHex();

            // ✅ Inicializar com escala 0 e opacidade 0 para animação
            cube.scale.set(0, 0, 0);
            // Para array de materiais, ajustar opacidade de todos
            materials.forEach(mat => mat.opacity = 0);
            
            scene.add(cube);
            cubeArray.push(cube);
            
            // ✅ Cubos começam invisíveis - só aparecem quando clicar na cabeça
            cube.visible = false;
            
            // Carregar texturas em background (não bloqueia criação do cubo)
            loadCubeTextures(faceImages, materials).catch(error => {
                console.warn(`Erro ao carregar texturas do cubo ${projectId}:`, error);
                // Cubo continua funcionando com material padrão
            });
        }

        // Nova função para configurar o listener do Firestore
        function setupFirestoreListener() {
            console.log("Limpando cubos existentes e configurando listener do Firestore...");
            
            // Primeiro remova todos os cubos existentes para evitar duplicatas ao (re)carregar
            while (cubeArray.length > 0) {
                const cube = cubeArray.pop();
                scene.remove(cube);
                // Liberar memória (opcional, mas recomendado)
                if (cube.geometry) cube.geometry.dispose();
                if (cube.material) {
                    if (Array.isArray(cube.material)) {
                        cube.material.forEach(m => m.dispose());
                    } else {
                        cube.material.dispose();
                    }
                }
            }
            console.log("Cubos limpos. Configurando listener do Firestore...");
            
            // Configurar o listener para atualizações em tempo real
            db.collection("projetos").onSnapshot((snapshot) => {
                console.log(`Snapshot do Firestore recebido: ${snapshot.docChanges().length} mudanças.`);
                
                // Processar as mudanças detectadas pelo Firestore
                snapshot.docChanges().forEach((change) => {
                    const projectId = change.doc.id;
                    const projectData = change.doc.data();
                    
                    console.log(`Tipo de mudança: ${change.type}, ID do Projeto: ${projectId}`);
                    
                    if (!projectData && change.type !== "removed") {
                        console.warn("Recebido change sem dados para o projeto:", projectId, change.type);
                        return; // Pular se não houver dados para added/modified

                    // Verificar se projectData tem um título válido
                    if (projectData && !projectData.title && projectData.name) {
                        projectData.title = projectData.name;
                        console.log(`Usando campo 'name' como título para o projeto ${projectId}: ${projectData.title}`);
                    }

                    if (change.type === "added") {
                        // Verificar se o cubo já existe para evitar duplicatas (deveria ser raro com a limpeza acima)
                        if (!cubeArray.some(cube => cube.userData.projectId === projectId)) {
                            console.log(`Criando cubo para o projeto adicionado: ${projectId}, título: ${projectData.title || 'Sem título'}`);

                       updateCubeData(projectId, projectData); // Apenas atualiza dados, não visibilidade

                       console.log(`Removendo cubo para o projeto: ${projectId}`);
                       removeCube(projectId); // Remove o cubo da cena
                    }

                    console.log(`- Cubo ${index}: ID=${cube.userData.projectId}, Título=${cube.userData.project?.name}, Visível=${cube.visible}`);

                 createCubesManually(); // Esta função precisa ser revisada também
            });
        }

        // Função para carregar um skybox aleatório
        function loadRandomSkybox() {
            var randomIndex = Math.floor(Math.random() * skyboxes.length);
            var selectedSkybox = skyboxes[randomIndex];
            
            var loader = new THREE.CubeTextureLoader();
            loader.load(
                selectedSkybox, 
                function(texture) {
                    scene.background = texture;
                    
                    // Aplicar o mapa de ambiente aos materiais, exceto aos olhos
                    scene.traverse(function(child) {
                        if (child.isMesh) {
                            const isEyePart = child.name && (
                                child.name.toLowerCase().includes('eye') || 
                                child.name.toLowerCase().includes('olho')
                            );
                            
                            if (!isEyePart && child.material) {
                                const materials = Array.isArray(child.material) 
                                    ? child.material 
                                    : [child.material];
                                
                                materials.forEach(mat => {
                                    if (mat && (mat.isMeshStandardMaterial || mat.isMeshPhysicalMaterial)) {
                                        mat.envMap = texture;
                                        mat.envMapIntensity = 1.0;
                                        mat.needsUpdate = true;
                                    }
                                });
                            }
                        }
                    });
                    
                    // ✅ Marcar skybox como completo (20% do total)
                    markComponentComplete('skybox');
                },
                // ✅ Callback de progresso do skybox
                function(xhr) {
                    if (xhr.lengthComputable && xhr.total > 0) {
                        // Atualizar progresso do skybox (0-100%)
                        loadingProgress.skybox = (xhr.loaded / xhr.total) * 100;
                        updateLoadingProgress();
                    }
                },
                function(error) {
                    console.error('Erro ao carregar o skybox:', error);
                    // ✅ Marcar como completo mesmo com erro (para não travar)
                    markComponentComplete('skybox');
                }
            );
        }

                    model.scale.set(1.2, 1.2, 1.2);
                    model.traverse(function(child) {
                        if (child.isMesh) {
                            console.log('Mesh:', child.name);
                            child.frustumCulled = false;
                            if (child.name && (child.name.toLowerCase().includes('eye') || child.name.toLowerCase().includes('olho') || child.name.toLowerCase().includes('olhos'))) {
                                child.renderOrder = 1;
                            }
                        }
                    });
                    scene.add(model);
                    
                    // ✅ Marcar modelo como completo (70% do total)
                    markComponentComplete('model');
                    
                    // Parar piscar quando modelo começar a carregar
                    stopBlinking();
                    
                    // Configurar animações
                    mixer = new THREE.AnimationMixer(model);
                    gltf.animations.forEach((clip) => {
                        mixer.clipAction(clip).play();
                    });

                    animateCameraToPosition(0, 0, 5);

                    if (xhr.lengthComputable && xhr.total > 0) {
                        loadingProgress.model = (xhr.loaded / xhr.total) * 100;
                        updateLoadingProgress();
                        if (loadingText) loadingText.textContent = 'Loading';
                        stopBlinking();

                }
            );

            showNotification("O nome do projeto deve ter no máximo 50 caracteres.", "error", true);
            return;
        }
        
        // Esconder modal
        hideCreateProjectModal();
        
        // Desabilitar botão durante criação
        const confirmButton = document.getElementById('confirm-create-button');
        if (confirmButton) {
            confirmButton.disabled = true;
            confirmButton.textContent = 'Criando...';
        }
        
        showNotification("Criando projeto...", "info", true);
        
        // Buscar IDs existentes e criar projeto
        db.collection("projetos").get()
            .then((snapshot) => {
                let maxId = 0;
                snapshot.forEach(doc => {
                    const numericId = parseInt(doc.id);
                    if (!isNaN(numericId) && numericId > maxId) {
                        maxId = numericId;
                    }
                });
                
                const newId = maxId + 1;
                const newIdString = newId.toString();
                
                // ✅ Usar o nome do input ao invés de "Novo Projeto X"
                const newProjectData = {
                    title: projectName, // ✅ Nome do input
                    description: "Descreva seu projeto aqui.\nUse \\n para novas linhas.",
                };
                
                return db.collection("projetos").doc(newIdString).set(newProjectData)
                    .then(() => newIdString);
            })
            .then((newIdString) => {
                showNotification(`Projeto "${projectName}" criado com sucesso!`, "success", true);
            })
            .catch((error) => {
                console.error("Erro ao criar projeto:", error);
                showNotification(`Erro ao criar projeto: ${error.message}`, "error", true);
            })
            .finally(() => {
                // Restaurar botão
                if (confirmButton) {
                    confirmButton.disabled = false;
                    confirmButton.textContent = 'Criar';
                }
            });
    }
    // --- Fim Funções de Criação de Projeto ---

    // Chamar a adição dos botões (eles ficarão escondidos até o login)
    if (document.body) {
         addLogoutButtonIndex();
         addCreateProjectButton(); // Adicionar chamada para o novo botão
    } else {
         document.addEventListener('DOMContentLoaded', () => {
             addLogoutButtonIndex();
             addCreateProjectButton(); // Adicionar chamada para o novo botão
         });
    }

    // --- FIM: Novas Funções de Autenticação e Logout para index.html ---
}

var cubeFocused = false; // Uma nova variável para rastrear o estado do foco

function onDocumentMouseUp(event) {
    var panel = document.getElementById('project-panel');
    if (panel && panel.classList.contains('visible')) { mouseDown = false; return; }
    if (!mouseDown) return;
    event.preventDefault();
    raycaster.setFromCamera(mouse, camera);
    var intersects = raycaster.intersectObjects(cubeArray);
    
    if (intersects.length > 0) {
        if (!cubeFocused) {
            selectedCube = intersects[0].object;
            
            var cubeCenter = new THREE.Vector3();
            selectedCube.geometry.computeBoundingBox();
            selectedCube.geometry.boundingBox.getCenter(cubeCenter);
            cubeCenter.applyMatrix4(selectedCube.matrixWorld);

            gsap.to(camera.position, {
                x: cubeCenter.x,
                y: cubeCenter.y,
                z: cubeCenter.z + 2,
                duration: 2,
                ease: "power3.inOut"
            });

            controls.target.set(cubeCenter.x, cubeCenter.y, cubeCenter.z);
            cubeFocused = true;
        } else {
            const projectId = selectedCube.userData.projectId;
            if (projectId) {
                openProject(projectId);
            }
        }
    } else if (cubeFocused) {
        resetCamera();
        cubeFocused = false;
        selectedCube = null;
    }
    mouseDown = false;
}

  function animate() {
    requestAnimationFrame(animate);
    
    const deltaTime = clock.getDelta();

    if (mixer) {
        mixer.update(deltaTime); 
    }

    renderer.render(scene, camera);
    
    // Lógica de rotação dos cubos
    cubeArray.forEach(cube => {
        var radius = Math.sqrt(cube.position.x * cube.position.x + cube.position.z * cube.position.z);
        // Calcula o incremento do ângulo para este frame usando rotationSpeed diretamente
        var currentAngle = Math.atan2(cube.position.z, cube.position.x) + rotationSpeed;
        cube.position.x = Math.cos(currentAngle) * radius;
        cube.position.z = Math.sin(currentAngle) * radius;
    });
    
    if (selectedCube && cubeFocused) {
        var cubeCenter = new THREE.Vector3();
        selectedCube.geometry.computeBoundingBox();
        selectedCube.geometry.boundingBox.getCenter(cubeCenter);
        cubeCenter.applyMatrix4(selectedCube.matrixWorld);
        
        var distance = 1;
        var direction = new THREE.Vector3().subVectors(camera.position, cubeCenter).normalize().multiplyScalar(distance);
        var newPosition = cubeCenter.clone().add(direction);

        gsap.to(camera.position, {
            x: newPosition.x,
            y: newPosition.y,
            z: newPosition.z,
            duration: 2,
            onUpdate: function() {
                camera.lookAt(cubeCenter);
            }
        });
        
        controls.target.copy(cubeCenter);
    }
}

    <!-- ===== SCRIPT DO PAINEL DE PROJETO (SPA) ===== -->
    <script>
    // ---------- ESTADO DO PAINEL ----------
    var _panelCurrentProjectId = null;
    var _panelCurrentSlide = 0;
    var _panelSlides = [];
    var _panelDots = [];

    // ---------- ABRIR / FECHAR PAINEL ----------
    function openProject(projectId) {
        if (!projectId) return;
        _panelCurrentProjectId = projectId;

        var panel = document.getElementById('project-panel');
        if (!panel) return;

        // Resetar estado do carrossel
        _panelCurrentSlide = 0;
        _panelSlides = [];
        _panelDots = [];

        // Resetar conteúdo
        var titleEl = document.getElementById('panel-project-title');
        var descEl  = document.getElementById('panel-project-description');
        var slidesEl = document.getElementById('panel-carousel-slides');
        var dotsEl   = document.getElementById('panel-carousel-dots');
        var navEl    = document.getElementById('panel-carousel-nav');
        if (titleEl) titleEl.textContent = 'Carregando...';
        if (descEl)  descEl.innerHTML   = '';
        if (slidesEl) slidesEl.innerHTML = '';
        if (dotsEl)   dotsEl.innerHTML   = '';
        if (navEl)    navEl.style.display = 'none';

        if (typeof controls !== 'undefined' && controls) controls.enabled = false;
        if (typeof INTERSECTED !== 'undefined' && INTERSECTED) {
            var mats = Array.isArray(INTERSECTED.material) ? INTERSECTED.material : [INTERSECTED.material];
            mats.forEach(function(m) { m.color.setHex(INTERSECTED.currentHex); });
            INTERSECTED = null;
        }
        if (typeof tooltip !== 'undefined' && tooltip) tooltip.style.visibility = 'hidden';

        panel.classList.add('visible');
        panel.style.opacity = '0';
        if (typeof gsap !== 'undefined') {
            gsap.to(panel, { opacity: 1, duration: 0.4, ease: 'power2.out' });
        } else {
            panel.style.opacity = '1';
        }

        // Atualizar URL sem navegar
        try { history.pushState({ projectPanel: projectId }, '', '?project=' + projectId); } catch(e) {}

        // Carregar dados do Firestore
        _panelLoadProjectData(projectId);

        // Inicializar upload se admin
        _panelInitImageUpload();
    }

    function closeProject() {
        var panel = document.getElementById('project-panel');
        if (!panel) return;

        var doClose = function() {
            panel.classList.remove('visible');
            panel.style.opacity = '';
            _panelCurrentProjectId = null;
            if (typeof controls !== 'undefined' && controls) controls.enabled = true;
            cubeFocused = false;
            selectedCube = null;
            if (typeof resetCamera === 'function') resetCamera();
            _panelDisableEditMode();
        };

        if (typeof gsap !== 'undefined') {
            gsap.to(panel, { opacity: 0, duration: 0.3, ease: 'power2.in', onComplete: doClose });
        } else {
            doClose();
        }

        // Restaurar URL
        try { history.pushState({}, '', window.location.pathname); } catch(e) {}
    }

    // Tratar botão back do navegador
    window.addEventListener('popstate', function(e) {
        var panel = document.getElementById('project-panel');
        if (panel && panel.classList.contains('visible')) {
            // Estava no painel, fechar sem pushState (já voltou)
            var doClose = function() {
                panel.classList.remove('visible');
                panel.style.opacity = '';
                _panelCurrentProjectId = null;
                if (typeof controls !== 'undefined' && controls) controls.enabled = true;
                cubeFocused = false;
                selectedCube = null;
                if (typeof resetCamera === 'function') resetCamera();
                _panelDisableEditMode();
            };
            if (typeof gsap !== 'undefined') {
                gsap.to(panel, { opacity: 0, duration: 0.3, ease: 'power2.in', onComplete: doClose });
            } else { doClose(); }
        }
    });

    // Botão Back do painel
    document.addEventListener('DOMContentLoaded', function() {
        var backBtn = document.getElementById('panel-back-button');
        if (backBtn) {
            backBtn.addEventListener('click', function(e) {
                e.preventDefault();
                closeProject();
            });
        }
        var prevBtn = document.getElementById('panel-prev-button');
        if (prevBtn) prevBtn.addEventListener('click', panelPrevSlide);
        var nextBtn = document.getElementById('panel-next-button');
        if (nextBtn) nextBtn.addEventListener('click', panelNextSlide);
    });

    // ---------- CARROSSEL DO PAINEL ----------
    function panelShowSlide(index) {
        var slidesEl = document.getElementById('panel-carousel-slides');
        var dotsEl   = document.getElementById('panel-carousel-dots');
        if (slidesEl) _panelSlides = Array.from(slidesEl.querySelectorAll('.carousel-slide'));
        if (dotsEl)   _panelDots  = Array.from(dotsEl.querySelectorAll('.carousel-dot'));

        if (!_panelSlides.length || index < 0 || index >= _panelSlides.length) return;

        _panelSlides.forEach(function(s) { s.classList.remove('active'); });
        _panelDots.forEach(function(d)  { d.classList.remove('active'); });
        _panelSlides[index].classList.add('active');
        if (_panelDots[index]) _panelDots[index].classList.add('active');
        _panelCurrentSlide = index;
    }

    function panelPrevSlide() {
        if (!_panelSlides.length) return;
        var n = _panelCurrentSlide - 1;
        if (n < 0) n = _panelSlides.length - 1;
        panelShowSlide(n);
    }

    function panelNextSlide() {
        if (!_panelSlides.length) return;
        var n = _panelCurrentSlide + 1;
        if (n >= _panelSlides.length) n = 0;
        panelShowSlide(n);
    }

    // ---------- CARREGAR DADOS DO FIRESTORE ----------
    function _panelLoadProjectData(projectId) {
        if (typeof db === 'undefined' || !db) return;
        projectId = String(projectId);
        db.collection('projetos').doc(projectId).get()
            .then(function(doc) {
                if (!doc.exists) {
                    var titleEl = document.getElementById('panel-project-title');
                    if (titleEl) titleEl.textContent = 'Projeto não encontrado';
                    return;
                }
                var data = doc.data();
                var titleEl = document.getElementById('panel-project-title');
                var descEl  = document.getElementById('panel-project-description');
                if (titleEl) {
                    titleEl.textContent = data.title || 'Sem título';
                    titleEl.classList.add('visible');
                }
                if (descEl) {
                    descEl.innerHTML = _panelFormatDescription(data.description);
                    descEl.classList.add('visible');
                }
                var imgs = (data.images && Array.isArray(data.images)) ? data.images : [];
                _panelRenderCarousel(imgs, projectId);
                // Ativar edição se admin já estiver logado
                if (typeof isAdminLoggedIn !== 'undefined' && isAdminLoggedIn) {
                    _panelEnableEditMode();
                }
            })
            .catch(function(err) {
                console.error('Erro ao buscar projeto no painel:', err);
                var titleEl = document.getElementById('panel-project-title');
                if (titleEl) titleEl.textContent = 'Erro ao carregar projeto';
            });
    }

    function _panelFormatDescription(text) {
        if (!text) return '';
        return text.replace(/\n/g, '<br>');
    }

    // ---------- IMAGENS ----------
    function _panelRenderCarousel(imageUrls, projectId) {
        var slidesEl = document.getElementById('panel-carousel-slides');
        var dotsEl   = document.getElementById('panel-carousel-dots');
        var navEl    = document.getElementById('panel-carousel-nav');
        if (!slidesEl || !dotsEl) return;

        slidesEl.innerHTML = '';
        dotsEl.innerHTML   = '';

        if (!imageUrls || !imageUrls.length) {
            slidesEl.innerHTML = '<p style="color:white;text-align:center;padding:20px;">Nenhuma imagem configurada.</p>';
            if (navEl) navEl.style.display = 'none';
            if (typeof isAdminLoggedIn !== 'undefined' && isAdminLoggedIn) _panelUpdateImageList([]);
            return;
        }

        imageUrls.forEach(function(url, idx) {
            var slide = document.createElement('div');
            slide.className = 'carousel-slide' + (idx === 0 ? ' active' : '');
            var img = document.createElement('img');
            img.alt = 'Imagem ' + (idx + 1);
            img.style.width = '100%';
            img.style.height = '100%';
            img.style.objectFit = 'cover';
            img.style.borderRadius = '8px';
            img.style.display = 'block';
            img.onerror = function() { slide.innerHTML = '<p style="color:white;text-align:center;padding:20px;">Erro ao carregar imagem</p>'; };
            slide.appendChild(img);
            slidesEl.appendChild(slide);
            img.src = url;

            var dot = document.createElement('div');
            dot.className = 'carousel-dot' + (idx === 0 ? ' active' : '');
            dot.setAttribute('data-index', idx);
            (function(i) { dot.addEventListener('click', function() { panelShowSlide(i); }); })(idx);
            dotsEl.appendChild(dot);
        });

        var carouselContainer = document.getElementById('panel-carousel-container');
        if (carouselContainer) carouselContainer.classList.add('visible');
        void slidesEl.offsetHeight;
        _panelSlides = Array.from(slidesEl.querySelectorAll('.carousel-slide'));
        _panelDots   = Array.from(dotsEl.querySelectorAll('.carousel-dot'));
        if (navEl) navEl.style.display = imageUrls.length > 1 ? 'flex' : 'none';
        _panelCurrentSlide = 0;
        setTimeout(function() { panelShowSlide(0); }, 50);

        if (typeof isAdminLoggedIn !== 'undefined' && isAdminLoggedIn) _panelUpdateImageList(imageUrls);
    }

    function _panelLoadProjectImages(projectId) {
        if (typeof db === 'undefined' || !db) return;
        db.collection('projetos').doc(String(projectId)).get()
            .then(function(doc) {
                var data = doc.data();
                var imageUrls = (data && data.images && Array.isArray(data.images)) ? data.images : [];
                _panelRenderCarousel(imageUrls, projectId);
            })
            .catch(function(err) {
                console.error('Erro ao carregar imagens do painel:', err);
                _panelRenderCarousel([], projectId);
            });
    }

    function _panelUpdateImageList(imageUrls) {
        var imageList = document.getElementById('panel-image-list');
        if (!imageList) return;
        imageList.innerHTML = '';
        if (!imageUrls.length) {
            imageList.innerHTML = '<p style="color:rgba(255,255,255,0.6);font-size:11px;text-align:center;margin:0;">Nenhuma imagem</p>';
            return;
        }
        imageUrls.forEach(function(url, idx) {
            var item = document.createElement('div');
            item.className = 'image-item';
            item.innerHTML = '<img src="' + url + '" alt="Preview" onerror="this.style.display=\'none\'">' +
                '<span style="flex:1;margin-left:5px;">Imagem ' + (idx + 1) + '</span>' +
                '<button class="delete-image-btn" data-index="' + idx + '">Deletar</button>';
            item.querySelector('.delete-image-btn').addEventListener('click', function() { _panelDeleteImage(idx); });
            imageList.appendChild(item);
        });
    }

    async function _panelDeleteImage(imageIndex) {
        if (typeof isAdminLoggedIn === 'undefined' || !isAdminLoggedIn) return;
        var projectId = _panelCurrentProjectId;
        if (!projectId) return;
        if (!confirm('Tem certeza que deseja deletar esta imagem?')) return;
        try {
            var projectRef = db.collection('projetos').doc(projectId);
            var projectDoc = await projectRef.get();
            var imageUrls  = (projectDoc.data() && projectDoc.data().images) || [];
            var urlToDelete = imageUrls[imageIndex];
            try {
                var urlParts = urlToDelete.split('/o/');
                if (urlParts.length > 1) {
                    var decodedPath = decodeURIComponent(urlParts[1].split('?')[0]);
                    await storage.ref(decodedPath).delete();
                }
            } catch(e) { console.warn('Falha ao deletar do Storage:', e); }
            var updated = imageUrls.filter(function(_, i) { return i !== imageIndex; });
            await projectRef.update({ images: updated });
            showNotification('Imagem deletada com sucesso!', 'success', true);
            _panelLoadProjectImages(projectId);
        } catch(err) {
            showNotification('Erro ao deletar: ' + err.message, 'error', true);
        }
    }

    // ---------- UPLOAD DE IMAGENS ----------
    function _panelInitImageUpload() {
        var uploadContainer = document.getElementById('panel-image-upload-container');
        var uploadInput     = document.getElementById('panel-image-upload-input');
        if (!uploadContainer || !uploadInput) return;

        if (typeof isAdminLoggedIn !== 'undefined' && isAdminLoggedIn) {
            uploadContainer.classList.add('visible');
        } else {
            uploadContainer.classList.remove('visible');
        }

        // Remover listener anterior para evitar duplicação
        var newInput = uploadInput.cloneNode(true);
        uploadInput.parentNode.replaceChild(newInput, uploadInput);

        newInput.addEventListener('change', async function(e) {
            var files = Array.from(e.target.files);
            if (!files.length) return;
            var validFiles = files.filter(function(f) { return f.type.startsWith('image/'); });
            if (!validFiles.length) { showNotification('Selecione apenas imagens.', 'error', true); newInput.value = ''; return; }
            var oversized = validFiles.filter(function(f) { return f.size > 5 * 1024 * 1024; });
            if (oversized.length) { showNotification('Máximo 5MB por imagem.', 'error', true); newInput.value = ''; return; }
            var projectId = _panelCurrentProjectId;
            if (!projectId) { showNotification('Erro: projeto não identificado.', 'error', true); return; }
            showNotification('Enviando ' + validFiles.length + ' imagem(ns)...', 'info', true);
            try {
                var urls = await Promise.all(validFiles.map(function(f) { return _panelUploadImage(projectId, f); }));
                await _panelSaveImageUrls(projectId, urls);
                showNotification('Imagens adicionadas com sucesso!', 'success', true);
                await new Promise(function(r) { setTimeout(r, 500); });
                await _panelLoadProjectImages(projectId);
                newInput.value = '';
            } catch(err) {
                showNotification('Erro no upload: ' + err.message, 'error', true);
                newInput.value = '';
            }
        });
    }

    function _panelUploadImage(projectId, file) {
        return new Promise(function(resolve, reject) {
            if (typeof storage === 'undefined' || !storage) { reject(new Error('Storage não inicializado.')); return; }
            var fileName  = Date.now() + '_' + file.name;
            var ref       = storage.ref('projects/' + projectId + '/' + fileName);
            var task      = ref.put(file);
            task.on('state_changed', null,
                function(err) { reject(err); },
                function() { task.snapshot.ref.getDownloadURL().then(resolve).catch(reject); }
            );
        });
    }

    async function _panelSaveImageUrls(projectId, newUrls) {
        if (typeof db === 'undefined' || !db) throw new Error('Firestore não inicializado.');
        var ref  = db.collection('projetos').doc(projectId);
        var doc  = await ref.get();
        var existing = (doc.data() && doc.data().images) || [];
        await ref.update({ images: existing.concat(newUrls) });
    }

    // ---------- MODO DE EDIÇÃO (ADMIN) ----------
    function _panelEnableEditMode() {
        if (typeof isAdminLoggedIn === 'undefined' || !isAdminLoggedIn) return;
        var titleEl = document.getElementById('panel-project-title');
        var descEl  = document.getElementById('panel-project-description');
        if (titleEl) { titleEl.contentEditable = 'true'; titleEl.style.border = '1px dashed #33ff33'; titleEl.style.padding = '5px'; }
        if (descEl)  { descEl.contentEditable  = 'true'; descEl.style.border  = '1px dashed #33ff33'; descEl.style.padding  = '5px'; }

        var panel = document.getElementById('project-panel');
        if (panel && !document.getElementById('panel-edit-indicator')) {
            var ind = document.createElement('div');
            ind.id = 'panel-edit-indicator';
            ind.textContent = 'MODO DE EDIÇÃO';
            ind.style.cssText = 'position:absolute;top:10px;right:20px;background-color:rgba(51,255,51,0.2);color:#33ff33;padding:5px 10px;border-radius:4px;font-family:Courier New,monospace;font-size:14px;font-weight:bold;border:1px solid #33ff33;z-index:600;';
            panel.appendChild(ind);
        }
        if (!document.getElementById('panel-save-button')) {
            var saveBtn = document.createElement('button');
            saveBtn.id = 'panel-save-button';
            saveBtn.textContent = 'Salvar Alterações';
            saveBtn.style.cssText = 'position:absolute;bottom:20px;right:20px;background-color:rgba(0,0,0,0.7);color:#33ff33;border:2px solid #33ff33;padding:8px 15px;border-radius:8px;font-family:Courier New,monospace;font-size:16px;font-weight:bold;cursor:pointer;z-index:600;';
            saveBtn.addEventListener('mouseover', function() { this.style.backgroundColor = 'rgba(51,255,51,0.2)'; });
            saveBtn.addEventListener('mouseout',  function() { this.style.backgroundColor = 'rgba(0,0,0,0.7)'; });
            saveBtn.addEventListener('click', _panelSaveChanges);
            var panel = document.getElementById('project-panel');
            if (panel) panel.appendChild(saveBtn);
        }
        if (!document.getElementById('panel-logout-button')) {
            var logoutBtn = document.createElement('button');
            logoutBtn.id = 'panel-logout-button';
            logoutBtn.textContent = 'Logout Admin';
            logoutBtn.style.cssText = 'position:absolute;top:10px;left:120px;color:#ff6b6b;background-color:rgba(0,0,0,0.7);border:2px solid #ff6b6b;padding:5px 10px;border-radius:8px;font-family:Courier New,monospace;font-size:14px;cursor:pointer;z-index:600;';
            logoutBtn.addEventListener('click', function() {
                if (typeof auth !== 'undefined' && auth) auth.signOut().then(function() { showNotification('Logout realizado.', 'success', true); });
            });
            var panel = document.getElementById('project-panel');
            if (panel) panel.appendChild(logoutBtn);
        }
        _panelInitImageUpload();
    }

    function _panelDisableEditMode() {
        var titleEl = document.getElementById('panel-project-title');
        var descEl  = document.getElementById('panel-project-description');
        if (titleEl) { titleEl.contentEditable = 'false'; titleEl.style.border = 'none'; titleEl.style.padding = '0'; }
        if (descEl)  { descEl.contentEditable  = 'false'; descEl.style.border  = 'none'; descEl.style.padding  = '0'; }
        var ind     = document.getElementById('panel-edit-indicator');     if (ind)     ind.remove();
        var saveBtn = document.getElementById('panel-save-button');        if (saveBtn) saveBtn.remove();
        var logBtn  = document.getElementById('panel-logout-button');      if (logBtn)  logBtn.remove();
        var upCont  = document.getElementById('panel-image-upload-container');
        if (upCont) upCont.classList.remove('visible');
    }

    function _panelSaveChanges() {
        if (typeof isAdminLoggedIn === 'undefined' || !isAdminLoggedIn) return;
        var projectId = _panelCurrentProjectId;
        if (!projectId) { showNotification('Erro: projeto não identificado.', 'error', true); return; }
        var titleEl = document.getElementById('panel-project-title');
        var descEl  = document.getElementById('panel-project-description');
        var newTitle = titleEl ? titleEl.textContent.trim() : '';
        var newDesc  = descEl  ? descEl.innerHTML.replace(/<br\s*[/]?>/gi, '\n').trim() : '';
        var saveBtn  = document.getElementById('panel-save-button');
        if (saveBtn) { saveBtn.textContent = 'Salvando...'; saveBtn.disabled = true; }
        db.collection('projetos').doc(projectId).update({ title: newTitle, description: newDesc })
            .then(function() {
                showNotification('Alterações salvas com sucesso!', 'success', true);
                _panelDisableEditMode();
            })
            .catch(function(err) {
                showNotification('Erro ao salvar: ' + err.message, 'error', true);
                if (saveBtn) { saveBtn.textContent = 'Salvar Alterações'; saveBtn.disabled = false; }
            });
    }

    // Quando admin logar/deslogar enquanto painel estiver aberto
    if (typeof auth !== 'undefined' && auth) {
        auth.onAuthStateChanged(function(user) {
            var panel = document.getElementById('project-panel');
            if (!panel || !panel.classList.contains('visible')) return;
            if (user && user.uid === (typeof ADMIN_UID !== 'undefined' ? ADMIN_UID : '')) {
                _panelEnableEditMode();
            } else {
                _panelDisableEditMode();
            }
        });
    }
    </script>

<div class="card" id="aboutCard" style="display: none;">
  <img src="asset/id.jpg" alt="">
</div>

<script>
  const card = document.getElementById('aboutCard');

  card.addEventListener('mouseenter', () => {
    gsap.to(card, { duration: 0.3, width: 280, height: 180, ease: "power1.out" }); // Aumenta o tamanho
  });

  card.addEventListener('mouseleave', () => {
    gsap.to(card, { duration: 0.3, width: 240, height: 140, ease: "power1.out" }); // Volta ao tamanho original
  });

  // Código para detectar a sequência de teclas "i" seguida de "d"
  let lastKeyPressed = '';
  let keySequence = '';
  
  document.addEventListener('keydown', function(event) {
    const key = event.key.toLowerCase();
    
    // Adiciona a tecla atual à sequência
    keySequence += key;
    
    // Verifica se a sequência termina com "id"
    if (keySequence.endsWith('id')) {
      // Alterna a visibilidade do card
      if (card.style.display === 'none') {
        card.style.display = 'flex';
        // Animação de entrada
        gsap.fromTo(card, 
          { opacity: 0, scale: 0.8 }, 
          { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.7)" }
        );
      } else {
        // Animação de saída
        gsap.to(card, { 
          opacity: 0, 
          scale: 0.8, 
          duration: 0.3, 
          ease: "power2.in",
          onComplete: function() {
            card.style.display = 'none';
          }
        });
      }
      
      // Limpa a sequência após detectar "id"
      keySequence = '';
    }
    
    // Limita o tamanho da sequência para evitar consumo de memória
    if (keySequence.length > 10) {
      keySequence = keySequence.slice(-10);
    }
  });
</script>
